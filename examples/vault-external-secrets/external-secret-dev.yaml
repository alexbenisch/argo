# Pulls org/kv/dev#api-key out of Vault into a normal Kubernetes Secret named
# 'dev-api-credentials' in the dev namespace, and re-checks every minute.
#
# The target Secret is created and owned by External Secrets, not by Argo CD —
# it is deliberately not in git. Rotate the value in Vault (re-run
# scripts/60-vault-seed.sh) and it turns up here within refreshInterval.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dev-api-key
  namespace: dev
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: dev-api-credentials
  data:
    - secretKey: api-key
      remoteRef:
        key: "dev"
        property: "api-key"
