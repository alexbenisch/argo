# Same as external-secret-dev.yaml but for the prod namespace, reading
# org/kv/prod#api-key. The point of the pair: one cluster-scoped store, two
# namespaces, two different secret values, zero secrets in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prod-api-key
  namespace: prod
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: prod-api-credentials
  data:
    - secretKey: api-key
      remoteRef:
        key: "prod"
        property: "api-key"
