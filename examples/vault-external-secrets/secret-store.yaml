# ClusterSecretStore — cluster-scoped, so a single store definition serves
# ExternalSecrets in any namespace (here: dev and prod).
#
# Changed vs. upstream tutorial:
#   - apiVersion v1beta1 -> v1. External Secrets chart 2.x stores v1 and only
#     serves v1beta1 behind crds.unsafeServeV1Beta1. The field layout is
#     otherwise identical.
#   - server host.docker.internal:8200 -> the in-cluster Service. See the
#     comment in manifests/apps/vault.yaml for why.
#   - tokenSecretRef namespace demo -> vault, where scripts/60-vault-seed.sh
#     creates it. A ClusterSecretStore's tokenSecretRef must name its namespace
#     explicitly (there is no "current" namespace for a cluster-scoped object).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      # KV v2 mount created by scripts/60-vault-seed.sh
      path: "org/kv"
      version: "v2"
      auth:
        tokenSecretRef:
          name: "vault-token"
          namespace: "vault"
          key: "token"
