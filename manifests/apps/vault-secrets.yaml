# Vault + External Secrets example (sync-wave 4): the ClusterSecretStore, one
# ExternalSecret per environment, and a consumer Deployment per environment.
#
# Wave 4 (after the webapp examples in wave 3) because the prod-side manifests
# land in the 'prod' namespace, which webapp-kustom-prod creates. Only 'dev' is
# created here via CreateNamespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/alexbenisch/argo.git
    targetRevision: main
    path: examples/vault-external-secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      # The ExternalSecrets only go Ready once Vault has been seeded by
      # scripts/60-vault-seed.sh, and the store can't authenticate until the
      # vault-token Secret exists. Back off and keep retrying instead of
      # sitting in Degraded.
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
