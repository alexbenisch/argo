# External Secrets Operator (sync-wave -1, alongside cert-manager) so its CRDs
# (ClusterSecretStore, ExternalSecret, ...) exist before the vault-secrets app
# in wave 4 tries to create them.
#
# Chart 2.x serves external-secrets.io/v1 as the storage version; v1beta1 (what
# the upstream tutorial YAML used) is only served if crds.unsafeServeV1Beta1 is
# turned on. The manifests in examples/vault-external-secrets/ use v1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs ship as regular chart templates and are large; server-side
      # apply avoids the 256KB last-applied-configuration annotation limit.
      - ServerSideApply=true
